# flatpak-builder --user --install build flatpak/io.github.shakaran.mailviewerkde.yml
#
# mailviewer-kde-sources.json holds the vendored crates, the build has no
# network. Regenerate it with flatpak-cargo-generator.py after touching
# Cargo.lock.
id: io.github.shakaran.mailviewerkde
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: "6.10"
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: mailviewer-kde

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # For the images a message pulls in, once the user asks for them.
  - --share=network
  # Attachments are extracted here before being handed to another application.
  - --filesystem=xdg-run/mailviewer-kde:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/mailviewer-kde/cargo
    CARGO_NET_OFFLINE: "true"

modules:
  - name: gmime
    sources:
      - type: archive
        url: https://github.com/jstedfast/gmime/releases/download/3.2.15/gmime-3.2.15.tar.xz
        sha256: 84cd2a481a27970ec39b5c95f72db026722904a2ccf3fdbd57b280cf2d02b5c4

  - name: mailviewer-kde
    buildsystem: simple
    build-commands:
      # QtWebEngine comes from the base app, in /app, while the rest of Qt is
      # in the SDK. cxx-qt reads a single folder, so give it one with both.
      - mkdir -p qtlibs
      - ln -sf /usr/lib/x86_64-linux-gnu/libQt6*.prl /usr/lib/x86_64-linux-gnu/libQt6*.so* qtlibs/
      - ln -sf /app/lib/x86_64-linux-gnu/libQt6*.prl /app/lib/libQt6*.so* qtlibs/
      - QMAKE=$(pwd)/flatpak/qmake-webengine.sh make install PREFIX=/app QT_LRELEASE=lrelease
    sources:
      - mailviewer-kde-sources.json
      - type: dir
        path: ..
