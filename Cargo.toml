[package]
name = "mailviewer-kde"
version = "0.1.0"
edition = "2021"
description = "KDE / Qt6 frontend for MailViewer"
license = "GPL-3.0+"

[dependencies]
cxx = "1.0"
gio = "0.22"
gmime = "0.8.1"
glib = "0.22"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_full"] }
mailviewer-core = { git = "https://github.com/alescdb/mailviewer-core", branch = "main" }

[build-dependencies]
cxx-qt-build = { version = "0.9", features = ["link_qt_object_files"] }
